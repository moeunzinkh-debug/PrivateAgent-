name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify native submodules are checked out
        run: |
          set -e
          SD_DIR="local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp"
          if [ ! -f "$SD_DIR/CMakeLists.txt" ]; then
            echo "::error::submodule $SD_DIR is empty. Run 'git submodule update --init --recursive'."
            git submodule status --recursive || true
            exit 1
          fi
          echo "stable-diffusion.cpp present:"
          (cd "$SD_DIR" && git rev-parse HEAD)

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform / build-tools / NDK / CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973" || sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"
          sdkmanager --list_installed || true
          yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build Debug APK
        # Native inference plugins (llama.cpp, stable-diffusion.cpp) ship
        # arm64-v8a only (see their abiFilters), so restrict the Flutter
        # target platform to android-arm64. Building armeabi-v7a/x86/x86_64
        # would quadruple the native compile time and fail: the bundled
        # libomp.so is arm64-only.
        run: flutter build apk --debug --target-platform android-arm64 --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
